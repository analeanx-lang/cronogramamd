<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Minuto a Minuto — Monster Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,100..900;1,75..125,100..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050505; --panel:#101013; --line:#26262c;
  --text:#F5F5F3;      /* títulos */
  --soft:#D8D8DE;      /* notas, texto corrido */
  --mid:#A2A2AC;       /* horários secundários */
  --label:#8C8C96;     /* etiquetas */
  --red:#F20B49; --amber:#FFC048;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(40px + var(--safe-b))}
.wrap{max-width:800px;margin:0 auto;padding:0 18px}

/* ---------- HERO ---------- */
header{position:relative;padding:32px 0 20px;overflow:hidden}
header::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(640px 240px at 6% -35%, rgba(242,11,73,.32), transparent 68%)}
.kicker{position:relative;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;
  font-weight:800;color:var(--red)}
h1{position:relative;font-size:clamp(38px,13vw,72px);line-height:.84;font-weight:900;font-style:italic;
  font-variation-settings:'wdth' 85,'wght' 900;text-transform:uppercase;margin:12px 0 0;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--red)}
.meta{position:relative;margin-top:11px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  font-weight:700;color:var(--mid)}
.meta b{color:var(--text)}

/* ---------- DIAS ---------- */
.days{position:sticky;top:0;z-index:40;background:rgba(5,5,5,.95);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:10px 0 11px;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:5px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:4px}
.seg button{flex:1;appearance:none;border:0;background:none;cursor:pointer;color:var(--mid);
  font-family:inherit;padding:10px 6px;border-radius:9px}
.seg .n{display:block;font-size:14px;font-weight:900;font-style:italic;
  font-variation-settings:'wdth' 88,'wght' 900;text-transform:uppercase;line-height:1}
.seg .h{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;margin-top:4px}
.seg button[aria-selected="true"]{background:var(--red);color:#fff}
.seg button[aria-selected="true"] .h{color:rgba(255,255,255,.85)}
.seg button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---------- RESUMO ---------- */
.recap{display:flex;margin:16px 0 2px;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;background:var(--panel)}
.recap div{flex:1;padding:11px 8px;text-align:center;border-right:1px solid var(--line)}
.recap div:last-child{border-right:0}
.recap b{display:block;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;
  letter-spacing:-.02em;color:var(--text)}
.recap i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--label);margin-top:5px}

/* ---------- PERÍODO ---------- */
.period{display:flex;align-items:center;gap:12px;margin:26px 0 2px}
.period span{font-size:10px;letter-spacing:.28em;text-transform:uppercase;font-weight:800;color:var(--red)}
.period::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(242,11,73,.55),var(--line))}

/* ---------- ITENS ---------- */
.item{display:grid;grid-template-columns:60px 1fr;column-gap:15px;padding:17px 0 18px;
  border-bottom:1px solid var(--line);position:relative}
.time{font-family:'JetBrains Mono',monospace;padding-top:1px}
.time .s{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.04em;color:var(--text)}
.time .e{display:block;font-size:11.5px;color:var(--mid);margin-top:2px;letter-spacing:-.02em}
.time .d{display:block;font-size:9.5px;color:var(--label);margin-top:9px;letter-spacing:.05em}
.title{font-size:17.5px;line-height:1.16;font-weight:800;font-style:italic;
  font-variation-settings:'wdth' 92,'wght' 800;text-transform:uppercase;color:var(--text)}
.who{margin-top:9px;font-size:11.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--red)}
.notes{margin-top:11px;display:flex;flex-direction:column;gap:9px}
.note{font-size:13.5px;line-height:1.45;color:var(--soft)}
.note .tag{display:inline-block;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;
  font-weight:800;padding:3px 6px;border-radius:4px;margin-right:8px;vertical-align:1px}
.note.ct .tag{background:rgba(255,255,255,.1);color:#BFBFC8}
.note.at{color:#FFDFA6}
.note.at .tag{background:rgba(255,192,72,.16);color:var(--amber)}

/* pausa: bloco sem palco */
.item.pause{background:rgba(255,255,255,.035);border-radius:10px;
  padding:13px 14px;margin:8px 0;border-bottom:0;column-gap:15px}
.item.pause .title{font-size:14.5px;font-style:normal;letter-spacing:.14em;
  font-variation-settings:'wdth' 100,'wght' 700;color:var(--soft)}
.item.pause .time .s{font-size:14px;color:var(--soft)}

/* pitch: marca operacional */
.item.pitch{border-left:2px solid var(--red);padding-left:13px;margin-left:-15px}
.item.pitch .title{color:#fff}

/* ---------- MENSAGENS ---------- */
.msg{padding:40px 0}
.msg .t{display:block;font-size:19px;font-weight:900;font-style:italic;
  font-variation-settings:'wdth' 88,'wght' 900;text-transform:uppercase;margin-bottom:10px}
.msg p,.msg ol{font-size:14px;line-height:1.6;color:var(--soft)}
.msg ol{margin:14px 0 0 17px;display:flex;flex-direction:column;gap:9px}
.msg code{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--red);
  background:var(--panel);padding:2px 5px;border-radius:4px;word-break:break-all}
.skel{height:70px;border-radius:10px;background:var(--panel);margin-bottom:9px;opacity:.6}

footer{margin-top:32px;padding:18px 0 0;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)}
footer button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--soft);
  font-family:inherit;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  padding:8px 14px;border-radius:8px;cursor:pointer}
footer button:active{border-color:var(--red);color:#fff}

/* ---------- DESKTOP ---------- */
@media (min-width:720px){
  header{padding:50px 0 26px}
  .wrap{padding:0 28px}
  .item{grid-template-columns:104px 1fr;column-gap:28px;padding:20px 0 21px}
  .time .s{font-size:18px}
  .time .e{font-size:13px}
  .title{font-size:21px}
  .item.pause .title{font-size:16px}
  .item.pitch{margin-left:-20px;padding-left:18px}
}

@media print{
  body{background:#fff;color:#000;padding:0}
  .days,footer,header::before{display:none}
  .panel[hidden]{display:block!important}
  .item{break-inside:avoid;border-bottom:1px solid #ddd}
  .title,.time .s,.recap b{color:#000}
  .note,.item.pause .title{color:#333}
  .who{color:#c2003a}
  .item.pause{background:#f4f4f4}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="kicker">Minuto a minuto</div>
    <h1>Monster<em>Day</em></h1>
    <div class="meta"><b>27 e 28 Jul</b> · Alphaville-SP · Uso interno</div>
  </div>
</header>

<div class="days"><div class="wrap"><div class="seg" id="seg" role="tablist" aria-label="Dias"></div></div></div>

<main class="wrap">
  <div id="panels"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <footer>
    <span id="fonte">Planilha Minuto a Minuto</span>
    <button id="reload" type="button">Atualizar</button>
  </footer>
</main>

<script>
/* ================= CONFIG ================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbxt1ijyRVMua4j6Ds6pzKs3g07HTjHbkoz9YU4IjT6eyIrJY7SkaRQIPHw7IUTUPAn9/exec';
var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5Tp611sN_yE-DkbLhdkbi7ingkxjhKMumxvxdcek1gNwFR1EDCwCQ6A-qDSqohaYWCtg74Y81_lfb/pub?gid=1924725972&single=true&output=csv';
/* A página carrega a planilha uma vez, ao abrir. Nada muda sozinho depois.
   Para pegar alterações da planilha, toque em Atualizar (ou recarregue). */

/* ---------- CSV ---------- */
function parseCSV(t){
  var rows=[],row=[],f='',q=false,i=0;
  t=t.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(;i<t.length;i++){
    var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f='' }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f='' }
    else f+=c;
  }
  row.push(f); rows.push(row); return rows;
}

/* ---------- helpers ---------- */
function cell(r,i){ return (r[i]||'').trim() }
function toMin(v){ var m=/^(\d{1,2}):(\d{2})/.exec(v||''); return m? (+m[1])*60+(+m[2]) : null }
function fmtDur(v){
  var m=/^(\d{1,2}):(\d{2})/.exec(v||''); if(!m) return v||'';
  var h=+m[1],mi=+m[2];
  return h ? h+'h'+(mi?String(mi).padStart(2,'0'):'') : mi+'min';
}
function spanTxt(a,b){
  var s=toMin(a),e=toMin(b); if(s===null||e===null) return '--';
  var d=e-s; if(d<0)d+=1440;
  return Math.floor(d/60)+'h'+String(d%60).padStart(2,'0');
}
function periodo(s){ return s===null?'':(s<720?'Manhã':(s<1080?'Tarde':'Noite')) }
var PAUSE=/almo[çc]o|coquetel|bar do|credenciamento|intervalo|coffee|networking/i;
var PITCH=/pitch|empilhamento/i;
function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }

/* ---------- planilha -> dias ---------- */
function buildDays(rows){
  var days=[],cur=null;
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(cell(r,0).toLowerCase()==='hora inicial'){
      var pa=cell(rows[i-1]||[],0), label='';
      if(pa && !/^coluna\s*\d+$/i.test(pa)) label=pa;
      cur={label:label||('Dia '+(days.length+1)),items:[]};
      days.push(cur); continue;
    }
    if(!cur) continue;
    if(!/^\d{1,2}:\d{2}/.test(cell(r,0)) || !cell(r,3)) continue;
    var extra=r.slice(6).map(function(c){return (c||'').trim()}).filter(Boolean).join(' · ');
    cur.items.push({
      start:cell(r,0), end:cell(r,1), dur:cell(r,2), desc:cell(r,3),
      speaker:cell(r,4), atencao:cell(r,5), conteudo:extra, s:toMin(cell(r,0))
    });
  }
  return days.filter(function(d){return d.items.length});
}

/* ---------- render ---------- */
function dayHTML(d){
  var f=d.items[0], l=d.items[d.items.length-1];
  var h='<div class="recap">'+
    '<div><b>'+esc(f.start)+'</b><i>Começa</i></div>'+
    '<div><b>'+esc(l.end)+'</b><i>Termina</i></div>'+
    '<div><b>'+d.items.length+'</b><i>Blocos</i></div>'+
    '<div><b>'+spanTxt(f.start,l.end)+'</b><i>Duração</i></div>'+
  '</div>';

  var atual='';
  d.items.forEach(function(it){
    var p=periodo(it.s);
    if(p && p!==atual){ atual=p; h+='<div class="period"><span>'+p+'</span></div>' }

    var cls='item';
    if(PAUSE.test(it.desc)) cls+=' pause';
    else if(PITCH.test(it.desc)) cls+=' pitch';

    h+='<div class="'+cls+'">'+
      '<div class="time"><span class="s">'+esc(it.start)+'</span>'+
        '<span class="e">'+esc(it.end)+'</span>'+
        (it.dur?'<span class="d">'+esc(fmtDur(it.dur))+'</span>':'')+'</div>'+
      '<div class="body"><div class="title">'+esc(it.desc)+'</div>'+
        (it.speaker?'<div class="who">'+esc(it.speaker)+'</div>':'')+
        ((it.conteudo||it.atencao)?'<div class="notes">'+
          (it.conteudo?'<div class="note ct"><span class="tag">Conteúdo</span>'+esc(it.conteudo)+'</div>':'')+
          (it.atencao?'<div class="note at"><span class="tag">Atenção</span>'+esc(it.atencao)+'</div>':'')+
        '</div>':'')+
      '</div></div>';
  });
  return h;
}

function renderAll(days){
  var seg=document.getElementById('seg'), panels=document.getElementById('panels');
  var saved=+(sessionStorage.getItem('md_day')||0);
  var active = saved<days.length ? saved : 0;

  seg.innerHTML=''; panels.innerHTML='';
  days.forEach(function(d,i){
    var b=document.createElement('button');
    b.type='button'; b.setAttribute('role','tab');
    b.setAttribute('aria-selected', i===active?'true':'false');
    b.innerHTML='<span class="n">'+esc(d.label)+'</span><span class="h">'+
      esc(d.items[0].start)+'–'+esc(d.items[d.items.length-1].end)+'</span>';
    b.addEventListener('click',function(){ pick(i) });
    seg.appendChild(b);

    var p=document.createElement('section');
    p.className='panel'; p.hidden = i!==active;
    p.innerHTML=dayHTML(d);
    panels.appendChild(p);
  });
}

function pick(i){
  sessionStorage.setItem('md_day',i);
  [].forEach.call(document.getElementById('seg').children,function(b,j){
    b.setAttribute('aria-selected', j===i?'true':'false') });
  [].forEach.call(document.querySelectorAll('.panel'),function(p,j){ p.hidden = j!==i });
  window.scrollTo({top:0});
}

/* ---------- dados: carrega uma vez ---------- */
var LOCAL = location.protocol==='file:';
function bust(u){ return u+(u.indexOf('?')>-1?'&':'?')+'_='+Date.now() }
function nota(txt){ document.getElementById('fonte').textContent=txt }

function apply(rows,fonte){
  var days=buildDays(rows);
  if(!days.length) throw new Error('sem linhas');
  renderAll(days);
  nota('Planilha lida às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · '+fonte);
}
function jsonp(url){
  return new Promise(function(res,rej){
    var cb='__md'+Math.random().toString(36).slice(2,10), s=document.createElement('script');
    var t=setTimeout(function(){done();rej(new Error('timeout'))},12000);
    function done(){ clearTimeout(t); try{delete window[cb]}catch(e){window[cb]=undefined}
      if(s.parentNode) s.parentNode.removeChild(s) }
    window[cb]=function(d){done();res(d)};
    s.onerror=function(){done();rej(new Error('bloqueado'))};
    s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+cb+'&_='+Date.now();
    document.head.appendChild(s);
  });
}
function handleApi(d){ if(!d||!d.ok) throw new Error((d&&d.error)||'inválido'); apply(d.rows,'planilha') }
function apiFetch(){ return fetch(bust(API_URL),{cache:'no-store'})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json() }).then(handleApi) }
function fromCsv(){ return fetch(bust(CSV_URL),{cache:'no-store'})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text() })
  .then(function(t){ apply(parseCSV(t),'csv') }) }

function fail(){
  nota('Falha ao ler a planilha');
  if(document.querySelector('.item')) return;
  document.getElementById('panels').innerHTML=
    '<div class="msg"><span class="t">Não consegui ler a planilha</span>'+
    '<p>'+(LOCAL
      ? 'O arquivo está aberto do disco (<code>file://</code>), onde o navegador bloqueia leitura externa. Hospedar resolve.'
      : 'Nenhuma das fontes respondeu.')+'</p>'+
    '<ol><li>No Apps Script, use a versão que aceita <b>callback</b> e faça <b>Implantar → Gerenciar implantações → lápis → Nova versão</b>.</li>'+
    '<li>Em <b>Quem tem acesso</b> precisa estar <b>Qualquer pessoa</b>.</li>'+
    '<li>Abra a URL <code>/exec</code> numa janela anônima: tem que mostrar o JSON sem pedir login.</li></ol></div>';
}
function load(){
  if(!API_URL) return fromCsv().catch(fail);
  if(LOCAL) return jsonp(API_URL).then(handleApi).catch(fail);
  return apiFetch().catch(function(){ return jsonp(API_URL).then(handleApi) })
                   .catch(function(){ return fromCsv() }).catch(fail);
}

document.getElementById('reload').addEventListener('click',load);
load();
</script>
</body>
</html>
